name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main # This triggers the script when you push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Grab your code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js so it can build your Next app
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      # 3. Install your dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Build the static HTML export (the 'out' folder)
      - name: Build Next.js App
        run: npm run build

      # 5. Upload the 'out' folder to Hostinger via FTP
      - name: Sync files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/ # Make sure this matches your Hostinger folder structure